          - generic [ref=e946]:
            - heading "Methodology" [level=6] [ref=e947]
            - heading "Analytic" [level=2] [ref=e948]
            - paragraph [ref=e949]: ISW does not receive any classified material from any source, uses only publicly available information, and draws extensively on Russian, Ukrainian, and Western reporting and social media as well as commercially available satellite imagery and other geospatial data as the basis for these reports. References to all sources used are provided in the endnotes of each update. ISW does not forecast Ukrainian actions, collect on Ukrainian activities beyond Ukrainian officials’ public statements and Russian or public reporting on Ukrainian activities, or map Ukrainian units’ locations.
